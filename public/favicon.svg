<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Simran Narwani monogram</title>
  <defs>
    <linearGradient id="purple-gradient" x1="7" y1="5" x2="59" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28135e"/>
      <stop offset=".52" stop-color="#6c2e7b"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#purple-gradient)"/>
  <rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="2"/>

  <!-- The oversized serif initials overlap like an editorial monogram. -->
  <text x="4" y="52" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="55" font-style="italic" font-weight="700">S</text>

  <!-- A cream keyline keeps the N legible where the two letters interlock. -->
  <text x="21" y="52" fill="none" stroke="#4a1f74" stroke-width="4" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700">N</text>
  <text x="21" y="52" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700">N</text>

  <circle cx="53" cy="11" r="3.5" fill="#f29ac1"/>
</svg>
